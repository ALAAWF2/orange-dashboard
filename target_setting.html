<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديد التارجت - Orange Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f9fa;
        }

        .navbar-brand {
            font-weight: 700;
            color: #fe7900 !important;
        }

        .bg-orange {
            background-color: #fe7900;
            color: white;
        }

        .table-hover tbody tr:hover {
            background-color: #fff3e0;
        }

        .input-target {
            width: 120px;
            font-weight: bold;
            text-align: center;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }

        .input-target:focus {
            border-color: #fe7900;
            box-shadow: 0 0 0 0.2rem rgba(254, 121, 0, 0.25);
            outline: 0;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-arrow-right me-2"></i> العودة للرئيسية
            </a>
            <span class="navbar-text fw-bold fs-5">
                🎯 تحديد التارجت الشهري (Monthly Target Setting)
            </span>
            <div>
                <span id="userNameDisplay" class="badge bg-secondary"></span>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 mt-4">

        <!-- Controls -->
        <div class="card border-0 shadow-sm p-3 mb-4">
            <div class="row align-items-center g-3">
                <div class="col-md-auto">
                    <label class="form-label fw-bold">اختر الشهر للتارجت الجديد:</label>
                    <input type="month" id="targetMonth" class="form-control">
                </div>
                <div class="col-md-auto">
                    <button class="btn btn-primary fw-bold" onclick="loadData()">
                        <i class="fas fa-sync-alt me-1"></i> تحميل بيانات المقارنة
                    </button>
                </div>
                <div class="col text-start">
                    <div class="alert alert-info py-2 mb-0 d-inline-block">
                        <i class="fas fa-info-circle me-1"></i>
                        يتم عرض بيانات نفس الشهر من السنة الماضية للمساعدة في اتخاذ القرار.
                    </div>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped table-hover align-middle mb-0 text-center">
                        <thead id="targetTableHeader" class="bg-dark text-white text-nowrap">
                            <!-- Rows will be injected here -->
                        </thead>
                        <tbody id="targetTableBody">
                            <!-- Rows will be injected here -->
                        </tbody>
                        <tfoot class="table-light fw-bold">
                            <tr id="tableFooter">
                                <!-- Totals -->
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
            <div class="card-footer bg-white py-3 text-start">
                <button class="btn btn-success btn-lg fw-bold px-5" onclick="saveTargetReport()">
                    <i class="fas fa-file-excel me-2"></i> حفظ التارجت (Save Excel)
                </button>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <script src="target_logic.js"></script>
    <script>
        // Auth Check
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser || (currentUser.name !== 'Sales Manager' && currentUser.role !== 'Admin')) {
            alert("عذراً، هذه الصفحة خاصة بمدير المبيعات فقط.");
            window.location.href = 'index.html';
        }
        document.getElementById('userNameDisplay').textContent = currentUser.name;
    </script>
</body>

</html>
