<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الجرد - شركة أورانج</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <!-- Bootstrap 5.3.0 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Google Fonts: Outfit & Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bs-primary: #fe7900;
            --orange-hover: #e06a00;
            --dark-bg: #1c1c1e;
            --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            --border-radius-sm: 8px;
            --border-radius-lg: 16px;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f5f5f7;
            color: #333;
            padding-bottom: 80px; /* Space for sticky actions on mobile */
        }

        .navbar {
            background-color: var(--dark-bg);
            border-bottom: 3px solid var(--bs-primary);
        }

        .navbar-brand {
            font-weight: 700;
            color: #fff !important;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-orange {
            color: var(--bs-primary);
        }

        .card {
            border: none;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
        }

        .btn-primary {
            background-color: var(--bs-primary);
            border-color: var(--bs-primary);
            font-weight: 700;
        }

        .btn-primary:hover, .btn-primary:focus {
            background-color: var(--orange-hover);
            border-color: var(--orange-hover);
        }

        /* Scanner Area Styles */
        #reader {
            width: 100%;
            height: 100%;
        }

        #reader video {
            object-fit: cover !important;
            border-radius: var(--border-radius-lg);
        }

        .scanner-laser {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background-color: var(--bs-primary);
            box-shadow: 0 0 10px var(--bs-primary);
            animation: scanning 2s linear infinite;
            z-index: 10;
        }

        @keyframes scanning {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        /* Scanned Item List Row */
        .scanned-row {
            transition: background-color 0.3s ease;
        }

        .scanned-row.just-added {
            background-color: rgba(254, 121, 0, 0.15);
        }

        /* Mobile Responsive adjustments */
        @media (max-width: 576px) {
            .container {
                padding-left: 8px;
                padding-right: 8px;
            }
            .card {
                padding: 12px !important;
                margin-bottom: 12px;
                border-radius: 12px;
            }
            .table-responsive {
                font-size: 0.82rem;
            }
            .btn-action-group {
                flex-direction: column;
                gap: 10px;
            }
        }

        .badge-diff {
            font-weight: bold;
        }

        .badge-diff.diff-equal {
            background-color: #198754;
            color: #fff;
        }

        .badge-diff.diff-surplus {
            background-color: #0dcaf0;
            color: #000;
        }

        .badge-diff.diff-deficit {
            background-color: #dc3545;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm py-3">
        <div class="container text-center justify-content-center">
            <span class="navbar-brand">
                🍊 مساعد الجرد الذكي <span class="brand-orange">| أورانج</span>
            </span>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container my-4">
        
        <!-- Step 1: Select Showroom & Join/Start Session -->
        <div class="card p-3" id="showroom-selection-card">
            <h5 class="card-title font-weight-bold mb-3">📍 اختيار معرض الجرد</h5>
            
            <div class="mb-3">
                <label for="employee-name-input" class="form-label">اسم الموظف المسؤول:</label>
                <input type="text" id="employee-name-input" class="form-control form-control-lg" placeholder="أدخل اسمك..." required autocomplete="name">
            </div>
            
            <div class="mb-3">
                <label for="showroom-select" class="form-label">المعرض الحالي:</label>
                <select id="showroom-select" class="form-select form-select-lg">
                    <option value="" disabled selected>جاري تحميل المعارض...</option>
                </select>
            </div>

            <!-- Dynamic Session Status Badge/Message -->
            <div id="session-status-area" class="mb-3" style="display: none;">
                <div class="alert alert-warning py-2 mb-0" id="session-status-message"></div>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex flex-column gap-2">
                <button id="start-session-btn" class="btn btn-primary btn-lg w-100" style="display: none;">
                    بدء جلسة جرد جديدة 🚀
                </button>
                <button id="join-session-btn" class="btn btn-success btn-lg w-100" style="display: none; background-color: #198754; border-color: #198754;">
                    الانضمام إلى الجلسة النشطة 🤝
                </button>
                <button id="override-session-btn" class="btn btn-outline-danger btn-sm w-100 mt-2" style="display: none;">
                    بدء جلسة جديدة وتجاوز الحالية ⚠️
                </button>
            </div>
        </div>

        <!-- Step 2: Scanner & Inputs (Initially Hidden) -->
        <div id="inventory-workspace" style="display: none;">
            
            <!-- Statistics Card -->
            <div class="card p-3 text-white bg-dark">
                <div class="row align-items-center">
                    <div class="col-8">
                        <h6 class="mb-1 text-muted">المعرض الجاري جرده:</h6>
                        <h4 id="active-outlet-name" class="brand-orange fw-bold mb-0">-</h4>
                    </div>
                    <div class="col-4 text-start">
                        <h6 class="mb-1 text-muted">إجمالي الممسوح:</h6>
                        <h4 id="total-scanned-qty" class="fw-bold mb-0">0</h4>
                    </div>
                </div>
            </div>

            <!-- Barcode Scanner Card -->
            <div class="card p-3">
                <h5 class="card-title font-weight-bold mb-3">📷 مسح الباركود</h5>
                <div class="position-relative overflow-hidden mx-auto mb-3" style="max-width: 400px; width: 100%; aspect-ratio: 1.2; border-radius: var(--border-radius-lg); border: 3px solid var(--bs-primary); background-color: #000;">
                    <!-- Video Container -->
                    <div id="reader"></div>
                    
                    <!-- Scanning Overlay Laser Line -->
                    <div class="scanner-laser" style="display: none;"></div>
                    
                    <!-- Flash Feedback Screen -->
                    <div id="scanner-flash" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(25, 135, 84, 0); transition: background-color 0.15s ease; z-index: 15; pointer-events: none; display: flex; align-items: center; justify-content: center; text-align: center;">
                        <span id="scanner-flash-text" class="text-white fw-bold px-3 py-2 rounded-pill" style="background-color: rgba(0, 0, 0, 0.7); display: none; font-size: 1.1rem; max-width: 90%;"></span>
                    </div>
                </div>
                
                <div class="d-flex justify-content-center gap-2 mb-3">
                    <button id="toggle-camera-btn" class="btn btn-primary btn-lg flex-fill">📷 تشغيل الكاميرا</button>
                    <button id="switch-camera-btn" class="btn btn-outline-secondary btn-lg" style="display: none;">🔄 تغيير الكاميرا</button>
                    <button id="toggle-torch-btn" class="btn btn-warning btn-lg" style="display: none;">🔦 تشغيل الفلاش</button>
                </div>
                
                <hr class="my-3">
                
                <!-- Manual Entry Form -->
                <form id="manual-barcode-form" class="row g-2 align-items-center">
                    <div class="col-8 col-sm-9">
                        <input type="text" id="manual-barcode-input" class="form-control form-control-lg" placeholder="أدخل الباركود أو رقم الصنف يدوياً..." autocomplete="off">
                    </div>
                    <div class="col-4 col-sm-3">
                        <button type="submit" class="btn btn-primary btn-lg w-100">مسح 🔍</button>
                    </div>
                </form>
                <div id="scan-feedback" class="mt-2 text-center fw-bold" style="display: none;"></div>
            </div>

            <!-- Current Inventory Table -->
            <div class="card p-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="card-title font-weight-bold mb-0">📦 قائمة المواد المجرودة</h5>
                    <button id="clear-current-inventory" class="btn btn-sm btn-outline-danger">مسح الكل 🗑️</button>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-bordered table-striped align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>رقم المنتج</th>
                                <th>اسم الصنف</th>
                                <th>الباركود</th>
                                <th class="text-center">المتوقع</th>
                                <th class="text-center">الفعلي</th>
                                <th class="text-center">الفرق</th>
                                <th class="text-center">الإجراء</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-tbody">
                            <tr>
                                <td colspan="7" class="text-center py-4 text-muted">لم يتم جرد أي مواد بعد. ابدأ بمسح الباركود!</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Action Footer -->
            <div class="card p-3">
                <h5 class="card-title font-weight-bold mb-3">💾 حفظ وإنهاء الجلسة</h5>
                <div class="d-flex flex-column gap-2">
                    <div class="d-flex gap-2 btn-action-group">
                        <button id="download-excel-btn" class="btn btn-success btn-lg flex-fill">
                            📥 تحميل Excel
                        </button>
                        <button id="whatsapp-share-btn" class="btn btn-info btn-lg flex-fill text-white" style="background-color: #25d366; border-color: #25d366;">
                            💬 مشاركة واتساب
                        </button>
                    </div>
                    <button id="complete-session-btn" class="btn btn-danger btn-lg w-100 mt-2">
                        🔒 إغلاق جلسة الجرد نهائياً للجميع
                    </button>
                </div>
            </div>

        </div>

    </div>

    <!-- Scripts -->
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SheetJS (Excel generation) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- html5-qrcode (Scanner) -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Application Logic -->
    <script src="app.js"></script>

</body>
</html>
