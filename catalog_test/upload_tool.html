<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة رفع الصور إلى الكتالوج - Cloudinary</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 650px;
            width: 100%;
            text-align: center;
        }
        h2 {
            color: #e67e22;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px dashed #e67e22;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            background-color: #fff8f0;
            cursor: pointer;
        }
        button {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            font-family: 'Tajawal', sans-serif;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #d35400;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
            text-align: right;
            max-height: 300px;
            overflow-y: auto;
            padding-left: 10px;
        }
        
        .preview-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: relative;
        }
        
        .preview-card img {
            width: 100%;
            height: 80px;
            object-fit: contain;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        
        .preview-card input[type="text"] {
            width: 100%;
            padding: 5px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            text-align: center;
            direction: ltr; /* Keeping code in English format */
        }
        
        .preview-card .status-icon {
            display: block;
            margin-top: 5px;
            font-size: 14px;
            font-weight: bold;
        }

        .status-general {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
            font-weight: bold;
        }
        .status-general.success { background-color: #d4edda; color: #155724; display: block; }
        .status-general.error { background-color: #f8d7da; color: #721c24; display: block; }
        .status-general.loading { background-color: #e2e3e5; color: #383d41; display: block; }
        
    </style>
</head>
<body>

<div class="container">
    <h2>أداة الرفع المجمّع للصور ☁️</h2>
    <p style="color: #666; font-size: 14px;">يمكنك اختيار عدة صور معاً. سيقوم النظام تلقائياً بتسمية كل منتج بناءً على اسم ملف صورته الأصلي.</p>

    <div class="form-group">
        <label for="imageFiles">إختيار الصور (يمكنك تحديد أكثر من صورة):</label>
        <input type="file" id="imageFiles" accept="image/png, image/jpeg, image/webp" multiple required>
    </div>

    <!-- شبكة استعراض الصور -->
    <div id="previewGrid" class="preview-grid"></div>

    <button id="uploadBtn" onclick="uploadAllImages()" style="display: none; margin-top:20px;">رفع جميع الصور الآن 🚀</button>

    <div id="statusMessage" class="status-general"></div>
</div>

<script>
    const CLOUD_NAME = 'dsp8ysswh'; 
    const UPLOAD_PRESET = 'unsigned_upload';

    const imageInput = document.getElementById('imageFiles');
    const previewGrid = document.getElementById('previewGrid');
    const uploadBtn = document.getElementById('uploadBtn');
    let selectedFiles = [];

    // عندما يختار المستخدم صورتين أو أكثر
    imageInput.addEventListener('change', function() {
        previewGrid.innerHTML = ''; // تنظيف الشاشة
        selectedFiles = Array.from(this.files);

        if (selectedFiles.length > 0) {
            uploadBtn.style.display = 'block';
            document.getElementById('statusMessage').style.display = 'none';

            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    // افتراض كود المنتج هو اسم الملف بدون لاحقة
                    const defaultCode = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                    
                    const card = document.createElement('div');
                    card.className = 'preview-card';
                    card.id = `card-${index}`;
                    
                    card.innerHTML = `
                        <img src="${e.target.result}" alt="Preview">
                        <label style="font-size:11px; margin-bottom:2px;">الكود/Alias:</label>
                        <input type="text" id="code-${index}" value="${defaultCode}">
                        <div id="status-${index}" class="status-icon" style="color:#666;">⏳ في الانتظار</div>
                    `;
                    previewGrid.appendChild(card);
                }
                reader.readAsDataURL(file);
            });
        } else {
            uploadBtn.style.display = 'none';
        }
    });

    async function uploadAllImages() {
        if (selectedFiles.length === 0) return;

        showGeneralStatus(`جاري الرفع... 0 من ${selectedFiles.length} ⏳`, 'loading');
        uploadBtn.disabled = true;

        let successCount = 0;
        let errorCount = 0;

        // سنقوم برفع الصور واحدة تلو الأخرى لمعرفة حالة كل صورة
        for (let i = 0; i < selectedFiles.length; i++) {
            const file = selectedFiles[i];
            const productCode = document.getElementById(`code-${i}`).value.trim();
            const statusLabel = document.getElementById(`status-${i}`);

            if (!productCode) {
                statusLabel.textContent = "❌ كود مفقود!";
                statusLabel.style.color = "red";
                errorCount++;
                continue;
            }

            statusLabel.textContent = "🚀 جاري الرفع...";
            statusLabel.style.color = "#e67e22";

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);
            formData.append('public_id', productCode); // اعتماد اسم الملف من الـ Input

            try {
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    statusLabel.textContent = "✅ تم الرفع";
                    statusLabel.style.color = "green";
                    successCount++;
                } else {
                    const data = await response.json();
                    statusLabel.textContent = "❌ خطأ";
                    statusLabel.style.color = "red";
                    console.error("Error uploading:", data.error.message);
                    errorCount++;
                }
            } catch (error) {
                statusLabel.textContent = "❌ فشل الاتصال";
                statusLabel.style.color = "red";
                errorCount++;
            }

            // تحديث الشريط العام
            showGeneralStatus(`جاري الرفع... ${i + 1} من ${selectedFiles.length} ⏳`, 'loading');
        }

        // إظهار النتيجة النهائية
        if (errorCount === 0) {
            showGeneralStatus(`✨ اكتمل! تم رفع ${successCount} صور بنجاح.`, 'success');
        } else {
            showGeneralStatus(`تم رفع ${successCount} بنجاح، و فشل رفع ${errorCount} صور!`, 'error');
        }

        uploadBtn.disabled = false;
    }

    function showGeneralStatus(message, type) {
        const div = document.getElementById('statusMessage');
        div.textContent = message;
        div.className = `status-general ${type}`;
    }
</script>

</body>
</html>
