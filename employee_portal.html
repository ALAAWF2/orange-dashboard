<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة إدارة ونقل الموظفين - Dynamics 365</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="users.js"></script>
    
    <style>
        :root {
            --bg-color: #f5f7fb;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent: #fe7900;
            --accent-hover: #e86800;
            --border-color: rgba(0, 0, 0, 0.08);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            --font-main: 'Cairo', sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background-image: radial-gradient(circle at 10% 20%, rgba(254, 121, 0, 0.04) 0%, transparent 60%);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 25px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            flex-wrap: wrap;
            gap: 20px;
            border-bottom: 4px solid var(--accent);
        }

        h1 {
            margin: 0;
            font-weight: 900;
            color: var(--accent);
            font-size: 1.8rem;
        }

        .user-badge {
            background: rgba(254, 121, 0, 0.1);
            color: var(--accent);
            border: 1px solid rgba(254, 121, 0, 0.2);
            padding: 6px 18px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .back-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: #1e293b;
            color: white;
            transform: translateY(-2px);
        }

        .glass-card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            padding: 25px;
            transition: all 0.3s;
        }

        .section-title {
            font-weight: 800;
            color: var(--text-primary);
            border-right: 4px solid var(--accent);
            padding-right: 12px;
            margin-bottom: 20px;
        }

        select, input {
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: var(--text-primary) !important;
            font-family: var(--font-main);
            font-weight: 600;
            outline: none;
            transition: 0.3s;
        }

        select:focus, input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(254, 121, 0, 0.2);
        }

        .btn-accent {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-accent:hover {
            background: var(--accent-hover);
            color: white;
            transform: translateY(-2px);
        }

        .btn-success-custom {
            background: var(--success);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-success-custom:hover {
            background: #059669;
            color: white;
            transform: translateY(-2px);
        }

        .shw-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #f8fafc;
            border: 1px solid #f1f5f9;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .shw-item:hover {
            background: #f1f5f9;
            border-color: #e2e8f0;
        }

        .badge-d365 {
            background: rgba(254, 121, 0, 0.08);
            color: var(--accent);
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            display: inline-block;
            margin: 2px;
        }

        .badge-d365-danger {
            background: rgba(239, 68, 68, 0.08);
            color: var(--danger);
        }

        .status-alert {
            display: none;
            border-radius: 12px;
            padding: 15px 20px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* Expandable Table Premium Styling */
        .table-premium {
            width: 100%;
            margin-bottom: 0;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        .table-premium tr.main-row {
            background: #ffffff;
            border-radius: 10px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .table-premium tr.main-row:hover {
            background: #fff8f2 !important;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(254, 121, 0, 0.06);
        }

        .table-premium tr.main-row.expanded-active {
            background: #fff3e6 !important;
            border-right: 4px solid var(--accent);
        }

        .table-premium th {
            color: var(--text-secondary);
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            border: none;
            padding: 12px 16px;
        }

        .table-premium td {
            border: none;
            padding: 16px;
            font-weight: 600;
            color: var(--text-primary);
            border-top: 1px solid #f1f5f9;
            border-bottom: 1px solid #f1f5f9;
        }

        .table-premium td:first-child {
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
            border-right: 1px solid #f1f5f9;
        }

        .table-premium td:last-child {
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            border-left: 1px solid #f1f5f9;
        }

        .collapse-row {
            background-color: transparent !important;
        }

        .collapse-row td {
            padding: 0 !important;
            border: none !important;
        }

        .expanded-card {
            background: #ffffff;
            border: 1.5px solid rgba(254, 121, 0, 0.15);
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            margin: 5px 16px 20px 16px;
            padding: 25px;
            border-top: 5px solid var(--accent);
            animation: fadeInSlide 0.25s ease-out;
        }

        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chevron-icon {
            transition: transform 0.3s ease;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .expanded-active .chevron-icon {
            transform: rotate(180deg);
            color: var(--accent);
        }

        .border-end-md {
            border-left: 1px solid var(--border-color);
        }

        @media (max-width: 768px) {
            .border-end-md {
                border-left: none;
                border-bottom: 1px solid var(--border-color);
                padding-bottom: 20px;
                margin-bottom: 20px;
            }
        }

        .table-container {
            max-height: 80vh;
            overflow-y: auto;
            padding-left: 5px;
        }

        /* Search input styling */
        .search-container {
            position: relative;
        }

        .search-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .search-input {
            width: 100%;
            padding-right: 45px;
            font-size: 0.95rem;
        }
    </style>
</head>

<body>

    <div class="container-fluid px-md-4">
        
        <!-- Header -->
        <div class="header">
            <div>
                <div class="d-flex align-items-center gap-3 flex-wrap">
                    <h1>⚙️ بوابة إدارة ونقل الموظفين (D365 Mappings)</h1>
                    <span id="userNameDisplay" class="user-badge">المدير: ...</span>
                </div>
            </div>
            <div>
                <a href="employees.html" class="back-btn"><i class="fas fa-arrow-left"></i> العودة للأداء</a>
            </div>
        </div>

        <!-- Alert Container -->
        <div id="statusAlert" class="alert status-alert" role="alert"></div>

        <!-- Main Workspace -->
        <div class="row">
            
            <!-- Full List of Employees (Interactive Accordion Table) -->
            <div class="col-12">
                <div class="glass-card d-flex flex-column gap-3">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <h5 class="section-title mb-0"><i class="fa-solid fa-users text-orange me-2"></i> قائمة موظفيك النشطين</h5>
                        <div class="search-container" style="width: 320px;">
                            <i class="fa-solid fa-magnifying-glass search-icon"></i>
                            <input type="text" id="searchInput" class="search-input" placeholder="بحث باسم أو رقم الموظف..." oninput="filterEmployeesTable()">
                        </div>
                    </div>

                    <!-- Interactive Collapsible Table -->
                    <div class="table-container mt-2">
                        <table class="table table-premium align-middle">
                            <thead>
                                <tr>
                                    <th>الموظف</th>
                                    <th>الرقم الوظيفي</th>
                                    <th>المعارض النشطة حالياً (Dynamics 365)</th>
                                    <th id="thManager" style="display: none;">مدير المنطقة</th>
                                </tr>
                            </thead>
                            <tbody id="employeesTableBody">
                                <!-- Populated dynamically with expandable main/details row pairs -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script>
        // Check local storage session login
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'login.html';
        }

        // Setup API Base
        let API_BASE = "http://localhost:5000";
        if (window.location.hostname && window.location.port !== "5000") {
            API_BASE = window.location.protocol + "//" + window.location.hostname + ":5000";
        }
        
        let activeEmp = null;
        let filteredEmployeesList = [];

        // Dynamic Auth Header compilation utilizing USERS master fallback
        function getAuthHeader() {
            const userName = currentUser ? currentUser.name : "علاء";
            const userPin = (currentUser && currentUser.pin) ? currentUser.pin : (typeof USERS !== "undefined" && USERS[userName] ? USERS[userName].pin : "0000");
            return "Basic " + btoa(unescape(encodeURIComponent(userName + ":" + userPin)));
        }

        // Smart dynamic API connection autodetect to support localhost, Ngrok, LAN IP, and public DNS
        async function detectActiveApiBase() {
            const candidates = [];
            const storedIp = sessionStorage.getItem('serverIp') || localStorage.getItem('serverIp');
            if (storedIp) candidates.push(storedIp);
            candidates.push(window.location.origin);
            if (window.location.hostname && window.location.port !== "5000") {
                candidates.push(window.location.protocol + "//" + window.location.hostname + ":5000");
            }
            candidates.push("http://localhost:5000");
            candidates.push("http://127.0.0.1:5000");
            
            const uniqueCandidates = [...new Set(candidates)];
            const authHeader = getAuthHeader();

            for (const url of uniqueCandidates) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 1200);
                    
                    const testUrl = url.endsWith('/') ? url.slice(0, -1) : url;
                    const res = await fetch(`${testUrl}/api/targets?month=2026-05`, {
                        method: 'GET',
                        headers: { 
                            'Authorization': authHeader,
                            'ngrok-skip-browser-warning': 'true'
                        },
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    
                    if (res.ok || res.status === 401) {
                        API_BASE = testUrl;
                        sessionStorage.setItem('serverIp', testUrl);
                        return;
                    }
                } catch (err) {
                    // Ignore
                }
            }
        }

        // Dynamic loading of data.js with cache busting
        window.addEventListener('DOMContentLoaded', () => {
            const scriptEl = document.createElement('script');
            scriptEl.src = 'data.js?v=' + Date.now();
            scriptEl.onload = async () => {
                await initializePage();
            };
            document.head.appendChild(scriptEl);
        });

        // Initial setup on data.js load
        async function initializePage() {
            // Verify roles
            const isManager = (currentUser.role === 'Manager');
            const isAdmin = (currentUser.role === 'Admin' || currentUser.name === 'Sales Manager');
            
            if (!isAdmin && !isManager) {
                alert("عذراً، هذه الصفحة مخصصة لمدراء الفروع والمبيعات فقط.");
                window.location.href = 'index.html';
                return;
            }

            const displayName = getCurrentUserDisplayName(currentUser);
            document.getElementById('userNameDisplay').textContent = isAdmin ? `المسؤول: ${displayName}` : `المدير: ${displayName}`;
            
            if (isAdmin) {
                document.getElementById('thManager').style.display = '';
            }

            // Load and filter employees list
            if (typeof EMPLOYEES !== "undefined") {
                filteredEmployeesList = isAdmin 
                    ? EMPLOYEES 
                    : EMPLOYEES.filter(emp => {
                        const isPrimary = emp.manager === currentUser.name;
                        const isSubShowroom = emp.showroomDetails && emp.showroomDetails.some(shw => shw.manager === currentUser.name);
                        return isPrimary || isSubShowroom;
                    });

                // Sort alphabetically
                filteredEmployeesList.sort((a, b) => a.name.localeCompare(b.name));
            }

            // Render table
            renderEmployeesTable();

            // Trigger server detection in background
            detectActiveApiBase();
        }

        // Render employees list in the table with collapsible details row structure
        function renderEmployeesTable() {
            const tbody = document.getElementById('employeesTableBody');
            tbody.innerHTML = '';

            const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
            const isAdmin = (currentUser.role === 'Admin' || currentUser.name === 'Sales Manager');

            const filtered = filteredEmployeesList.filter(emp => {
                if (searchVal) {
                    const matchName = emp.name.toLowerCase().includes(searchVal);
                    const matchNum = emp.personnelNumber.toLowerCase().includes(searchVal);
                    return matchName || matchNum;
                }
                return true;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="${isAdmin ? 4 : 3}" class="text-center py-5 text-muted">
                            <i class="fa-solid fa-users-slash fa-2x mb-2 d-block" style="opacity:0.3"></i>
                            لا توجد نتائج تطابق البحث.
                        </td>
                    </tr>
                `;
                return;
            }

            filtered.forEach(emp => {
                // Showrooms list as badges
                let showroomsHtml = '';
                if (emp.showroomDetails && emp.showroomDetails.length > 0) {
                    emp.showroomDetails.forEach(s => {
                        showroomsHtml += `<span class="badge-d365"><i class="fa-solid fa-store me-1"></i> ${s.name}</span>`;
                    });
                } else {
                    showroomsHtml = '<span class="badge-d365 badge-d365-danger"><i class="fa-solid fa-triangle-exclamation me-1"></i> غير مربوط بأي فروع</span>';
                }

                // Main Row
                const trMain = document.createElement('tr');
                trMain.className = 'main-row';
                trMain.id = `emp-row-${emp.personnelNumber}`;
                trMain.onclick = () => toggleEmployeeRow(emp.personnelNumber);
                trMain.innerHTML = `
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <i class="fa-solid fa-chevron-down chevron-icon me-2" id="chevron-${emp.personnelNumber}"></i>
                            <strong>${emp.name}</strong>
                        </div>
                    </td>
                    <td><span class="badge bg-light text-dark border px-2 py-1">${emp.personnelNumber}</span></td>
                    <td>${showroomsHtml}</td>
                    ${isAdmin ? `<td><span class="text-secondary small fw-bold">${emp.manager || 'غير محدد'}</span></td>` : ''}
                `;

                // Collapsible Detail Row
                const trDetail = document.createElement('tr');
                trDetail.className = 'collapse-row';
                trDetail.id = `details-row-${emp.personnelNumber}`;
                trDetail.style.display = 'none';
                trDetail.innerHTML = `
                    <td colspan="${isAdmin ? 4 : 3}">
                        <div class="expanded-card" id="details-content-${emp.personnelNumber}">
                            <!-- Dynamic Content Rendered on Expand -->
                        </div>
                    </td>
                `;

                tbody.appendChild(trMain);
                tbody.appendChild(trDetail);
            });

            // Re-highlight and expand active employee if still present
            if (activeEmp) {
                const mainRow = document.getElementById(`emp-row-${activeEmp.personnelNumber}`);
                if (mainRow) {
                    toggleEmployeeRow(activeEmp.personnelNumber);
                }
            }
        }

        function filterEmployeesTable() {
            renderEmployeesTable();
        }

        // Toggle Accordion function
        function toggleEmployeeRow(personnelNumber) {
            const detailsRow = document.getElementById(`details-row-${personnelNumber}`);
            const mainRow = document.getElementById(`emp-row-${personnelNumber}`);
            const chevron = document.getElementById(`chevron-${personnelNumber}`);
            const isCurrentlyExpanded = detailsRow.style.display !== 'none';

            // First, collapse all other open details rows
            document.querySelectorAll('.collapse-row').forEach(row => {
                row.style.display = 'none';
            });
            document.querySelectorAll('.main-row').forEach(row => {
                row.classList.remove('expanded-active');
            });
            document.querySelectorAll('.chevron-icon').forEach(icon => {
                icon.style.transform = 'rotate(0deg)';
                icon.classList.remove('text-orange');
            });

            if (!isCurrentlyExpanded) {
                // Expand selected employee
                detailsRow.style.display = 'table-row';
                mainRow.classList.add('expanded-active');
                if (chevron) {
                    chevron.style.transform = 'rotate(180deg)';
                    chevron.classList.add('text-orange');
                }

                // Render dynamic operational details
                renderEmployeeDetails(personnelNumber);
            } else {
                activeEmp = null;
            }
        }

        // Render Action Forms dynamically inside the expanded row
        function renderEmployeeDetails(personnelNum) {
            const emp = filteredEmployeesList.find(e => e.personnelNumber === personnelNum);
            if (!emp) return;

            activeEmp = emp; // set active reference
            const container = document.getElementById(`details-content-${personnelNum}`);

            // 1. Build list of current showrooms with inline delete buttons
            let currentShowroomsHtml = '';
            let fromSelectOptions = '<option value="" selected disabled>-- اختر الفرع للحذف --</option>';

            if (emp.showroomDetails && emp.showroomDetails.length > 0) {
                emp.showroomDetails.forEach(shw => {
                    const codesStr = JSON.stringify(shw.codes);
                    
                    currentShowroomsHtml += `
                        <div class="shw-item mb-2">
                            <div>
                                <span class="fw-bold small text-dark"><i class="fa-solid fa-store text-orange me-1"></i> ${shw.name}</span>
                            </div>
                            <button class="btn btn-danger btn-sm px-3 py-1 fw-bold" onclick="executeRemove('${shw.name}', ${codesStr.replace(/"/g, '&quot;')})">
                                <i class="fa-solid fa-minus-circle me-1"></i> إزالة الربط
                            </button>
                        </div>
                    `;

                    fromSelectOptions += `<option value='${codesStr}'>${shw.name}</option>`;
                });
            } else {
                currentShowroomsHtml = '<div class="text-muted text-center py-3 small bg-light rounded">غير مربوط بأي فروع حالياً.</div>';
            }

            // 2. Build Destination Select Options (Sort alphabetically)
            let toSelectOptions = '<option value="" selected disabled>-- اختر الفرع الجديد --</option>';
            let addSelectOptions = '<option value="" selected disabled>-- اختر الفرع الإضافي --</option>';

            if (typeof ALL_SHOWROOMS !== "undefined") {
                const sortedShowrooms = [...ALL_SHOWROOMS].sort((a, b) => a.name.localeCompare(b.name));
                sortedShowrooms.forEach(shw => {
                    const codesStr = JSON.stringify(shw.codes);
                    toSelectOptions += `<option value='${codesStr}'>${shw.name}</option>`;
                    addSelectOptions += `<option value='${codesStr}'>${shw.name}</option>`;
                });
            }

            // Write forms HTML right inside the table accordion card
            container.innerHTML = `
                <div class="row g-4">
                    <!-- Column 1: Current Showrooms & Add Showroom Mappings -->
                    <div class="col-md-6 border-end-md">
                        <h6 class="fw-bold mb-3 text-orange border-bottom pb-2"><i class="fa-solid fa-store me-2"></i> الفروع الحالية والربط الإضافي</h6>
                        <p class="text-secondary small mb-3">الفروع المنسوبة للموظف حالياً في Dynamics 365. يمكنك إزالة الربط بفرع معين، أو ربطه بفروع إضافية دون إلغاء فروع الحالية.</p>
                        
                        <div class="mb-4">
                            <label class="form-label small text-muted fw-bold mb-2">الفروع النشطة حالياً:</label>
                            <div class="d-flex flex-column gap-1">
                                ${currentShowroomsHtml}
                            </div>
                        </div>
                        
                        <div class="pt-3 border-top">
                            <label class="form-label small text-muted fw-bold mb-2">ربط الموظف بمعرض إضافي جديد:</label>
                            <div class="d-flex gap-2 flex-wrap">
                                <select id="expanded-add-to-${personnelNum}" class="form-select flex-grow-1" style="min-width: 200px;">
                                    ${addSelectOptions}
                                </select>
                                <button class="btn btn-success fw-bold px-4" onclick="executeAdd('${personnelNum}')">
                                    <i class="fa-solid fa-square-plus me-1"></i> ربط إضافي
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Column 2: D365 Transfer (Delete & Add in One Step) -->
                    <div class="col-md-6">
                        <h6 class="fw-bold mb-3 text-orange border-bottom pb-2"><i class="fa-solid fa-arrows-spin me-2"></i> نقل الموظف واستبدال معرضه (Transfer)</h6>
                        <p class="text-secondary small mb-3">نقل الموظف مباشرة من معرضه القديم إلى معرض جديد. سيقوم النظام بإلغاء إسناد المعرض القديم وإضافة المعرض الجديد في خطوة واحدة آمنة.</p>
                        
                        <div class="d-flex flex-column gap-3">
                            <div>
                                <label class="form-label small text-muted fw-bold mb-1">المعرض الحالي المراد حذفه:</label>
                                <select id="expanded-transfer-from-${personnelNum}" class="form-select w-100">
                                    ${fromSelectOptions}
                                </select>
                            </div>
                            <div>
                                <label class="form-label small text-muted fw-bold mb-1">الوجهة (المعرض الجديد المراد نقله إليه):</label>
                                <select id="expanded-transfer-to-${personnelNum}" class="form-select w-100">
                                    ${toSelectOptions}
                                </select>
                            </div>
                            <button class="btn btn-accent w-100 py-3 mt-2 fw-bold" onclick="executeTransfer('${personnelNum}')">
                                <i class="fa-solid fa-right-left"></i> تأكيد النقل والاستبدال فوراً
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Show Alert utility
        function showAlert(msg, type = 'success') {
            const alertEl = document.getElementById('statusAlert');
            alertEl.textContent = msg;
            alertEl.className = `alert status-alert alert-${type}`;
            alertEl.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Execute Remove Showroom
        async function executeRemove(shwName, codesToRemove) {
            if (!confirm(`هل أنت متأكد من إزالة الموظف من معرض "${shwName}"؟`)) return;

            showAlert("جاري تنفيذ طلب الإزالة وإلغاء الربط من خوادم Dynamics 365...", "warning");

            try {
                const res = await fetch(`${API_BASE}/api/remove_employee`, {
                    method: "POST",
                    headers: { 
                        "Authorization": getAuthHeader(), 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({
                        personnelNumber: activeEmp.personnelNumber,
                        addressBookCodes: codesToRemove
                    })
                });

                if (res.ok) {
                    showAlert(`✅ تمت إزالة الموظف "${activeEmp.name}" من المعرض "${shwName}" بنجاح! جاري تحديث الصفحة لإعادة مزامنة التغييرات...`, "success");
                    setTimeout(() => window.location.reload(), 2000);
                } else {
                    const err = await res.json();
                    showAlert("❌ حدث خطأ من السيرفر: " + (err.error || "خطأ غير معروف"), "danger");
                }
            } catch (e) {
                showAlert("❌ خطأ في الاتصال بالشبكة: " + e.message, "danger");
            }
        }

        // Execute Transfer
        async function executeTransfer(personnelNum) {
            const fromSelect = document.getElementById(`expanded-transfer-from-${personnelNum}`);
            const toSelect = document.getElementById(`expanded-transfer-to-${personnelNum}`);
            
            const fromCodesVal = fromSelect.value;
            const toCodesVal = toSelect.value;

            if (!fromCodesVal || !toCodesVal) {
                alert("الرجاء اختيار المعرض الحالي والوجهة.");
                return;
            }

            if (fromCodesVal === toCodesVal) {
                alert("المعرض القديم والجديد متطابقان!");
                return;
            }

            if (!confirm("هل أنت متأكد من عملية النقل؟ سيتم استبدال المعرض للموظف في قاعدة بيانات Dynamics 365.")) return;

            showAlert("جاري معالجة ونقل الموظف في دايناميكس... يرجى الانتظار ولا تغلق الصفحة...", "warning");

            try {
                const res = await fetch(`${API_BASE}/api/transfer_employee`, {
                    method: "POST",
                    headers: { 
                        "Authorization": getAuthHeader(), 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({
                        personnelNumber: activeEmp.personnelNumber,
                        oldAddressBookCodes: JSON.parse(fromCodesVal),
                        newAddressBookCodes: JSON.parse(toCodesVal)
                    })
                });

                if (res.ok) {
                    showAlert(`✅ تم نقل الموظف "${activeEmp.name}" بنجاح! يتم الآن إعادة تحميل الصفحة لتطبيق التحديثات.`, "success");
                    setTimeout(() => window.location.reload(), 2000);
                } else {
                    const err = await res.json();
                    showAlert("❌ حدث خطأ أثناء عملية النقل: " + (err.error || "خطأ غير معروف"), "danger");
                }
            } catch (e) {
                showAlert("❌ خطأ في الاتصال بالسيرفر: " + e.message, "danger");
            }
        }

        // Execute Add Showroom
        async function executeAdd(personnelNum) {
            const addSelect = document.getElementById(`expanded-add-to-${personnelNum}`);
            const codesVal = addSelect.value;
            
            if (!codesVal) {
                alert("الرجاء اختيار المعرض الإضافي.");
                return;
            }

            if (!confirm("هل أنت متأكد من إضافة هذا المعرض للموظف؟ لن يتم حذفه من الفروع الحالية.")) return;

            showAlert("جاري ربط الموظف بالفرع الإضافي على خوادم Dynamics 365...", "warning");

            try {
                const res = await fetch(`${API_BASE}/api/add_employee`, {
                    method: "POST",
                    headers: { 
                        "Authorization": getAuthHeader(), 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({
                        personnelNumber: activeEmp.personnelNumber,
                        addressBookCodes: JSON.parse(codesVal)
                    })
                });

                if (res.ok) {
                    showAlert(`✅ تم ربط الموظف "${activeEmp.name}" بالمعرض الإضافي بنجاح! جاري تحديث الصفحة لتحديث مزامنة البيانات.`, "success");
                    setTimeout(() => window.location.reload(), 2000);
                } else {
                    const err = await res.json();
                    showAlert("❌ حدث خطأ من السيرفر: " + (err.error || "خطأ غير معروف"), "danger");
                }
            } catch (e) {
                showAlert("❌ خطأ في الاتصال بالشبكة: " + e.message, "danger");
            }
        }
    </script>

</body>

</html>
