<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORANGE AI Assistant</title>
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Tajawal) -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            flex: 1;
            max-width: 900px;
            margin: 20px auto;
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #ff6600, #ff8533);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header h5 {
            margin: 0;
            font-weight: 700;
        }

        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            overflow-x: hidden;
            background-color: #f9f9f9;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            width: 100%;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-content {
            padding: 12px 18px;
            border-radius: 15px;
            max-width: 85%;
            position: relative;
            line-height: 1.6;
            font-size: 15px;
            word-wrap: break-word;
            word-break: break-word;
            min-width: 0; /* Prevents table or long content from stretching the flex item */
        }

        .user .message-content {
            background-color: #007bff;
            color: white;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 2px;
        }

        .bot .message-content {
            background-color: #fff;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 2px;
            border-bottom-right-radius: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
            font-size: 14px;
        }

        .user .avatar {
            background-color: #0056b3;
            color: white;
        }

        .bot .avatar {
            background-color: #ff6600;
            color: white;
        }

        .chat-footer {
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
        }

        .input-group {
            background: #f0f2f5;
            border-radius: 25px;
            padding: 5px;
        }

        .form-control {
            border: none;
            background: transparent;
            box-shadow: none;
        }

        .form-control:focus {
            background: transparent;
            box-shadow: none;
        }

        .btn-send {
            border-radius: 50%;
            width: 40px;
            height: 40px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Table Styling for Data Results */
        .bot-table {
            width: 100%;
            margin-top: 10px;
            border-collapse: collapse;
            font-size: 14px;
        }

        .bot-table th,
        .bot-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: right;
        }

        .bot-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }

        .typing-indicator {
            display: none;
            padding: 10px;
            font-style: italic;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="chat-container">
        <div class="chat-header">
            <div>
                <i class="fas fa-robot me-2"></i> مساعد أورانج الذكي
            </div>
            <a href="index.html" class="btn btn-sm btn-outline-light text-white border-white">عودة للرئيسية</a>
        </div>

        <div class="chat-body" id="chatBody">
            <!-- Welcome Message -->
            <div class="message bot">
                <div class="avatar"><i class="fas fa-robot"></i></div>
                <div class="message-content">
                    مرحباً بك! أنا مساعدك الذكي 🤖<br>
                    يمكنك سؤالي عن المبيعات، الفروع، أو أي بيانات مخزنة في النظام.<br>
                    مثال: "كم مبيعات فرع النخيل البارحة؟"
                </div>
            </div>
        </div>

        <div class="typing-indicator text-center" id="loading">
            <i class="fas fa-circle-notch fa-spin me-2"></i> جاري تحليل البيانات...
        </div>

        <div class="chat-footer">
            <form id="chatForm" onsubmit="sendMessage(event)">
                <div class="input-group">
                    <input type="text" id="userInput" class="form-control" placeholder="اكتب سؤالك هنا..."
                        autocomplete="off">
                    <button type="submit" class="btn btn-primary btn-send">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Check authentication and authorization
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'login.html';
        } else if (currentUser.role !== 'Admin' && currentUser.name !== 'Sales Manager' && currentUser.name !== 'علاء') {
            alert('عذراً، لا تملك صلاحية للوصول لهذه الصفحة. هذه الصفحة مخصصة لـ Sales Manager والمسؤول فقط.');
            window.location.href = 'index.html';
        }

        const authHeader = 'Basic ' + btoa(unescape(encodeURIComponent(currentUser.name + ':' + currentUser.pin)));
        const chatBody = document.getElementById('chatBody');
        const loading = document.getElementById('loading');

        function parseMarkdown(text) {
            if (!text) return "";
            // Escape HTML tags to prevent XSS
            let html = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
                
            // Bold (**text**)
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            // Inline/Newline numbered lists (e.g. " 1. ", " 2. ", "\n1. ") -> convert to new lines with bold numbering
            html = html.replace(/(?:\s+|(?=<br>)|^)(\d+)\.\s+/g, '<br><strong>$1.</strong> ');
            
            // Headings (###, ##, #)
            html = html.replace(/###\s+(.*?)(?=\n|<br>|$)/g, '<h6 class="fw-bold mt-3 mb-2 text-primary">$1</h6>');
            html = html.replace(/##\s+(.*?)(?=\n|<br>|$)/g, '<h5 class="fw-bold mt-3 mb-2 text-primary">$1</h5>');
            html = html.replace(/#\s+(.*?)(?=\n|<br>|$)/g, '<h4 class="fw-bold mt-3 mb-2 text-primary">$1</h4>');
            
            // Bullet points (at the start of a line)
            html = html.replace(/^\s*[-*]\s+(.*?)$/gm, '• $1');
            
            // Newlines
            html = html.replace(/\n/g, '<br>');
            
            // Clean up multiple consecutive <br> tags
            html = html.replace(/(<br>\s*){3,}/g, '<br><br>');
            
            // Clean up leading <br> tags
            html = html.replace(/^(<br>\s*)+/g, '');
            
            return html;
        }

        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('userInput');
            const question = input.value.trim();
            if (!question) return;

            // Add User Message
            appendMessage(question, 'user');
            input.value = '';

            // Show Loading
            loading.style.display = 'block';
            chatBody.scrollTop = chatBody.scrollHeight;

            try {
                // Resolve API Base dynamically
                let API_BASE = window.location.origin;
                if (!API_BASE || API_BASE.startsWith('file://') || API_BASE.includes('github.io')) {
                    API_BASE = sessionStorage.getItem('serverIp') || localStorage.getItem('serverIp') || "http://127.0.0.1:5000";
                }
                if (API_BASE.endsWith('/')) API_BASE = API_BASE.slice(0, -1);

                // Call Python Server
                const response = await fetch(`${API_BASE}/ask`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': authHeader,
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify({ question: question })
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (data.error) {
                    appendMessage("عذراً، حدث خطأ: " + data.error, 'bot');
                } else {
                    // Check if response is conversational or data-table
                    if (data.sql_result && Array.isArray(data.sql_result)) {
                        let msg = parseMarkdown(data.answer) + "<br>";
                        msg += createTable(data.columns, data.sql_result);
                        appendMessage(msg, 'bot');
                    } else {
                        appendMessage(parseMarkdown(data.answer), 'bot');
                    }
                }

            } catch (err) {
                loading.style.display = 'none';
                appendMessage("عذراً، لا يمكن الاتصال بالخادم. تأكد من تشغيل `server.py`.", 'bot');
                console.error(err);
            }
        }

        function appendMessage(htmlContent, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = `
                <div class="avatar"><i class="fas fa-${type === 'user' ? 'user' : 'robot'}"></i></div>
                <div class="message-content">${htmlContent}</div>
            `;
            chatBody.appendChild(div);
            // Scroll to bottom
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function createTable(columns, rows) {
            if (!rows || rows.length === 0) return "<small class='text-muted d-block mt-2'>لا توجد بيانات.</small>";

            let html = '<div class="table-responsive mt-3 rounded shadow-sm border" style="max-height: 350px; overflow: auto;"><table class="bot-table table table-sm table-striped mb-0"><thead><tr class="table-light">';
            columns.forEach(col => {
                let displayCol = col;
                if (col === 'store_id') displayCol = 'رمز الفرع';
                else if (col === 'store_name') displayCol = 'اسم المعرض';
                else if (col === 'sales') displayCol = 'المبيعات';
                else if (col === 'targets') displayCol = 'المستهدف';
                else if (col === 'visitors') displayCol = 'الزوار';
                else if (col === 'transactions') displayCol = 'الفواتير';
                else if (col === 'items') displayCol = 'القطع';
                else if (col === 'manager') displayCol = 'المدير المسؤول';
                else if (col === 'city') displayCol = 'المدينة';
                else if (col === 'target_achievement_percent') displayCol = 'تحقيق المستهدف %';
                else if (col === 'conversion_rate_percent') displayCol = 'نسبة التحويل %';
                else if (col === 'average_ticket') displayCol = 'متوسط الفاتورة';
                else if (col === 'average_items_per_trans') displayCol = 'معدل قطع/فاتورة';
                else if (col === 'employee_name') displayCol = 'اسم الموظف';
                else if (col === 'employee_id') displayCol = 'رقم الموظف';
                else if (col === 'date') displayCol = 'التاريخ';
                else if (col === 'max_ticket') displayCol = 'أكبر فاتورة';
                
                html += `<th>${displayCol}</th>`;
            });
            html += '</tr></thead><tbody>';

            rows.forEach(row => {
                html += '<tr>';
                row.forEach(cell => {
                    let val = cell;
                    if (val === null || val === undefined) {
                        val = '-';
                    } else if (typeof val === 'number') {
                        if (!Number.isInteger(val)) {
                            val = val.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                        } else {
                            val = val.toLocaleString('en-US');
                        }
                    }
                    html += `<td>${val}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            return html;
        }
    </script>
</body>

</html>
