<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المستهدفات - لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --accent: #ff7900;
            /* Orange */
            --accent-hover: #ff9100;
            --border-color: #404040;
            --success: #28a745;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin: 0;
            font-weight: 700;
            color: var(--accent);
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        input[type="month"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #404040;
            color: white;
            font-family: 'Cairo';
        }

        .refresh-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .refresh-btn:hover {
            background: var(--accent-hover);
        }

        .grid-container {
            display: grid;
            gap: 20px;
        }

        .store-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.2s;
        }

        .store-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #333;
            cursor: pointer;
        }

        .store-header:hover {
            background: #3d3d3d;
        }

        .store-title {
            font-size: 1.1em;
            font-weight: 600;
        }

        .store-target-input {
            background: #222;
            border: 1px solid #555;
            color: var(--accent);
            padding: 5px 10px;
            border-radius: 6px;
            width: 120px;
            text-align: center;
            font-weight: bold;
        }

        .emp-list {
            display: none;
            /* Hidden by default */
            padding: 15px;
            background: #252525;
            border-top: 1px solid var(--border-color);
        }

        .emp-list.active {
            display: block;
        }

        .emp-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #333;
        }

        .emp-row:last-child {
            border-bottom: none;
        }

        .emp-name {
            font-size: 0.95em;
            color: var(--text-secondary);
        }

        .emp-input {
            background: #333;
            border: 1px solid #444;
            color: white;
            padding: 5px;
            border-radius: 4px;
            width: 100px;
            text-align: center;
        }

        .save-indicator {
            font-size: 0.8em;
            margin-right: 10px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .save-indicator.saved {
            color: var(--success);
            opacity: 1;
        }

        .btn-save {
            background: #444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
        }

        .btn-save:hover {
            background: var(--success);
        }

        /* Login Modal */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            width: 300px;
        }

        .login-input {
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #555;
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

    <!-- Login Overlay -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2 style="color:var(--accent)">تسجيل الدخول</h2>

            <label style="display:block; text-align:right; margin-bottom:5px; color:#888; font-size:0.8em">IP السيرفر
                (اتركه فارغاً إذا كنت على نفس الجهاز)</label>
            <input type="text" id="serverIp" class="login-input" placeholder="مثال: 192.168.1.15 (اختياري)">

            <input type="text" id="username" class="login-input" placeholder="اسم المستخدم">
            <input type="password" id="password" class="login-input" placeholder="كلمة المرور">
            <button class="refresh-btn" onclick="login()">دخول</button>
            <p id="loginError" style="color:red; display:none; margin-top:10px;">بيانات خاطئة</p>
        </div>
    </div>

    <!-- Main Content -->
    <div id="appContent" style="filter: blur(5px); pointer-events: none;">
        <div class="header">
            <div>
                <h1>إدارة المستهدفات</h1>
                <p style="color:var(--text-secondary); margin: 5px 0;">تحكم كامل بمستهدفات الفروع والموظفين</p>
            </div>
            <div class="controls">
                <label>الشهر:</label>
                <input type="month" id="targetMonth">
                <button class="refresh-btn" onclick="fetchData()">تحديث البيانات</button>
            </div>
        </div>

        <div id="storesContainer" class="grid-container">
            <!-- Stores will be loaded here -->
            <div style="text-align:center; padding: 50px;">جاري التحميل...</div>
        </div>
    </div>


    <!-- Visitor Edit Modal -->
    <div id="visitorModal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; justify-content:center; align-items:center;">
        <div
            style="background:var(--card-bg); padding:20px; border-radius:12px; width:80%; max-width:800px; max-height:90vh; overflow-y:auto; border:1px solid var(--border-color);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 id="visitorModalTitle" style="color:var(--accent); margin:0;">تعديل الزوار</h2>
                <button onclick="closeVisitorModal()"
                    style="background:none; border:none; color:#888; font-size:1.5em; cursor:pointer;">&times;</button>
            </div>

            <table style="width:100%; border-collapse:collapse; color:white; font-size:0.9em;">
                <thead style="background:#333; position:sticky; top:0;">
                    <tr>
                        <th style="padding:10px;">التاريخ</th>
                        <th style="padding:10px;">الفواتير</th>
                        <th style="padding:10px;">الزوار الحالي</th>
                        <th style="padding:10px;">تحويل %</th>
                        <th style="padding:10px;">الزوار الجديد</th>
                        <th style="padding:10px;">تحويل جديد %</th>
                    </tr>
                </thead>
                <tbody id="visitorTableBody">
                    <!-- Rows -->
                </tbody>
            </table>

            <div style="margin-top:20px; text-align:right;">
                <button class="refresh-btn" style="background:#444;" onclick="closeVisitorModal()">إلغاء</button>
                <button class="refresh-btn" onclick="saveVisitorChanges()">حفظ التعديلات</button>
            </div>
        </div>
    </div>

    <!-- Logic Script -->
    <script src="admin_logic.js"></script>
    <script>
        // --- Visitor Editing Logic (Embedded for simplicity) ---
        let currentStoreId = null;
        let visitorDataCache = []; // To store original fetched data

        async function openVisitorModal(sid, sname) {
            currentStoreId = sid;
            const m = document.getElementById('targetMonth').value; // YYYY-MM
            document.getElementById('visitorModalTitle').textContent = `تعديل زوار: ${sname} (${m})`;

            const tbody = document.getElementById('visitorTableBody');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px;">جاري التحميل...</td></tr>';

            document.getElementById('visitorModal').style.display = 'flex';

            try {
                const token = authHeader || sessionStorage.getItem('auth');
                const res = await fetch(`${API_BASE}/api/daily_stats?store_id=${sid}&month=${m}`, {
                    headers: {
                        'Authorization': token,
                        'ngrok-skip-browser-warning': 'true'
                    }
                });

                if (!res.ok) throw new Error("Failed to fetch data");
                const data = await res.json();

                // Sort by Date
                data.sort((a, b) => a.date.localeCompare(b.date));
                visitorDataCache = data;

                renderVisitorTable(data);

            } catch (e) {
                alert("Error: " + e.message);
                closeVisitorModal();
            }
        }

        function renderVisitorTable(data) {
            const tbody = document.getElementById('visitorTableBody');
            tbody.innerHTML = '';

            data.forEach((row, idx) => {
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid #444';

                const conv = row.visitors > 0 ? (row.transactions / row.visitors * 100).toFixed(1) : "0.0";

                // Determine day name
                const d = new Date(row.date);
                const dayName = d.toLocaleDateString('ar-EG', { weekday: 'short' });

                tr.innerHTML = `
                    <td style="padding:8px; text-align:center;">${row.date} <span style="color:#888; font-size:0.8em">(${dayName})</span></td>
                    <td style="padding:8px; text-align:center;">${row.transactions}</td>
                    <td style="padding:8px; text-align:center; color:#aaa;">${row.visitors}</td>
                    <td style="padding:8px; text-align:center; color:${getColor(conv)}">${conv}%</td>
                    <td style="padding:8px; text-align:center;">
                        <input type="number" class="emp-input" style="width:80px;" 
                               value="${row.visitors}" 
                               oninput="calcNewConv(this, ${row.transactions}, 'newConv-${idx}')" 
                               data-date="${row.date}" 
                               id="vis-input-${idx}">
                    </td>
                    <td style="padding:8px; text-align:center; font-weight:bold;" id="newConv-${idx}">${conv}%</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function getColor(val) {
            if (val >= 20) return '#28a745';
            if (val >= 10) return '#ffc107';
            return '#dc3545';
        }

        function calcNewConv(input, trans, outId) {
            const newVis = parseInt(input.value) || 0;
            const out = document.getElementById(outId);
            if (newVis > 0) {
                const nw = (trans / newVis * 100).toFixed(1);
                out.textContent = nw + '%';
                out.style.color = getColor(nw);
            } else {
                out.textContent = '0.0%';
                out.style.color = '#dc3545';
            }
        }

        function closeVisitorModal() {
            document.getElementById('visitorModal').style.display = 'none';
        }

        async function saveVisitorChanges() {
            const inputs = document.querySelectorAll('input[id^="vis-input-"]');
            const updates = [];

            inputs.forEach(inp => {
                const date = inp.getAttribute('data-date');
                const val = parseInt(inp.value);
                // Check if changed? Actually, might be safer to send all or just check against cache.
                // Let's send all non-zero/valid ones to be safe, or check cache.
                // Simple: Send all rows.
                updates.push({
                    date: date,
                    store_id: currentStoreId,
                    visitors: val
                });
            });

            try {
                const token = authHeader || sessionStorage.getItem('auth');
                const res = await fetch(`${API_BASE}/api/daily_visitors`, {
                    method: 'POST',
                    headers: {
                        'Authorization': token,
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify(updates)
                });

                if (!res.ok) throw new Error("Failed to save");
                alert("تم حفظ تعديلات الزوار بنجاح!");
                closeVisitorModal();
                // Optionally refresh main data if needed, but main data is targets.
            } catch (e) {
                alert("Error saving: " + e.message);
            }
        }
    </script>
</body>

</html>
